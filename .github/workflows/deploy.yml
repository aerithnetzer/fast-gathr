name: Build, Push & Deploy

on:
  push:
    branches: [main]

env:
  AWS_REGION: us-east-1
  APP_NAME: fast-gathr

jobs:
  deploy:
    name: Build → Push → Deploy
    runs-on: ubuntu-latest
    environment: Fastr-Environment
    permissions:
      contents: read

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. AWS credentials ───────────────────────────────────────────────────
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      # ── 3. Terraform setup ───────────────────────────────────────────────────
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.6"

      # ── 4. Terraform init ────────────────────────────────────────────────────
      - name: Terraform init
        working-directory: infra
        run: terraform init

      # ── 5. Ensure ECR repository exists before Docker push ───────────────────
      - name: Terraform apply (ECR only)
        working-directory: infra
        env:
          TF_VAR_image_tag:   ${{ github.sha }}
          TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
        run: terraform apply -auto-approve -target=aws_ecr_repository.app

      # ── 5b. Create ACM cert (no-op if already exists) ────────────────────────
      # Targeting just the cert so we can output the DNS validation records
      # before we try to validate. On the FIRST run this will create the cert
      # in PENDING_VALIDATION state; you must then create the CNAME shown in
      # the output below in Cloudflare (DNS only / grey cloud), then re-run.
      - name: Terraform apply (ACM cert only)
        working-directory: infra
        env:
          TF_VAR_image_tag:   ${{ github.sha }}
          TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
        run: terraform apply -auto-approve -target=aws_acm_certificate.api

      - name: Show ACM DNS validation records
        working-directory: infra
        run: |
          echo "Create the following CNAME record in Cloudflare (DNS only / grey cloud):"
          terraform output -json acm_validation_records | jq

      # ── 6. ECR login ─────────────────────────────────────────────────────────
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # ── 7. Build & push Docker image ─────────────────────────────────────────
      - name: Build and push image to ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE_URI="${ECR_REGISTRY}/${{ env.APP_NAME }}:${IMAGE_TAG}"
          docker build -t "$IMAGE_URI" -t "${ECR_REGISTRY}/${{ env.APP_NAME }}:latest" .
          docker push "$IMAGE_URI"
          docker push "${ECR_REGISTRY}/${{ env.APP_NAME }}:latest"
          echo "image_uri=$IMAGE_URI" >> "$GITHUB_OUTPUT"

      # ── 8. Terraform apply (full) ─────────────────────────────────────────────
      # db_password is passed as a secret so it never appears in logs or state.
      - name: Terraform apply
        working-directory: infra
        env:
          TF_VAR_image_tag:   ${{ github.sha }}
          TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
        run: terraform apply -auto-approve

      # ── 8. Force new ECS deployment ──────────────────────────────────────────
      # Ensures the service picks up the new image even if the task definition
      # didn't change (e.g. when only app code changed within the same tag).
      - name: Force new ECS deployment
        run: |
          aws ecs update-service \
            --cluster "${{ env.APP_NAME }}" \
            --service  "${{ env.APP_NAME }}" \
            --force-new-deployment \
            --region   "${{ env.AWS_REGION }}"

      # ── 9. Wait for stability ─────────────────────────────────────────────────
      - name: Wait for service to stabilize
        run: |
          aws ecs wait services-stable \
            --cluster "${{ env.APP_NAME }}" \
            --services "${{ env.APP_NAME }}" \
            --region "${{ env.AWS_REGION }}"
