# Alembic configuration.
#
# The migration env reads DATABASE_URL from the environment, so this file
# only needs to point at the script directory.

[alembic]
script_location = app/alembic
prepend_sys_path = app
path_separator = os
# sqlalchemy.url is set at runtime in env.py from the DATABASE_URL env var.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
