[project]
name = "fast-gathr-mcp"
version = "0.1.0"
description = "Hosted MCP server exposing the fast-gathr API as Claude tools."
requires-python = ">=3.14"
dependencies = [
    "mcp>=1.2",
    "httpx>=0.28",
    "pydantic>=2.10",
    "starlette>=0.41",
    "uvicorn>=0.32",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fast_gathr_mcp"]
